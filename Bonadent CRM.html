<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Caja y Agenda Dental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: banda superior con la clínica + pestañas; cada pestaña es una mesa de trabajo de ancho máximo 1180px */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --ink:#12302f; --muted:#5a7371; --line:#d5e1df;
  --accent:#0f6e68; --accent-ink:#ffffff; --soft:#e2efec;
  --in:#1b7646; --out:#b0412c; --warn:#9a6200; --info:#2b5fa8;
  --display:"Familjen Grotesk",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1615; --surface:#12201e; --ink:#e1eeeb; --muted:#8fa7a4; --line:#24403c;
  --accent:#4fc0b4; --accent-ink:#06201e; --soft:#172e2b;
  --in:#5bc98a; --out:#ee8a73; --warn:#e2b250; --info:#86b0ee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1615; --surface:#12201e; --ink:#e1eeeb; --muted:#8fa7a4; --line:#24403c;
  --accent:#4fc0b4; --accent-ink:#06201e; --soft:#172e2b;
  --in:#5bc98a; --out:#ee8a73; --warn:#e2b250; --info:#86b0ee; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-family:var(--display);font-size:1.45rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:.9rem}
.mode{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.mode.live{color:var(--in);border-color:currentColor}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 .95rem var(--display);background:none;border:0;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.badge{font:500 .7rem var(--mono);background:var(--out);color:var(--surface);border-radius:99px;padding:1px 6px}
main .wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--display);font-size:1.25rem;margin:0}
h3{font-family:var(--display);font-size:1.02rem;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .val{font:500 1.45rem var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .note{font-size:.82rem;color:var(--muted)}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.btn{font:700 .88rem var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;padding:5px 8px}
.btn.sm{font-size:.8rem;padding:4px 9px}
.btn.danger{color:var(--out)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.chip{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.st-programada{color:var(--info)} .st-confirmada{color:var(--in)} .st-completada{color:var(--muted)} .st-cancelada{color:var(--out)} .st-aplazada{color:var(--warn)}
.st-borrador{color:var(--muted)} .st-enviada{color:var(--info)} .st-aprobada{color:var(--in)} .st-rechazada{color:var(--out)}
.ex{font-size:.65rem;color:var(--warn);border:1px dashed currentColor;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:middle}
.agenda{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.doccol{display:flex;flex-direction:column;gap:8px;min-width:0}
.doccol > header{border-bottom:2px solid var(--line);padding-bottom:6px}
.cita{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cita.confirmada{border-left-color:var(--in)} .cita.completada{border-left-color:var(--line);opacity:.75} .cita.cancelada{border-left-color:var(--out);opacity:.6} .cita.aplazada{border-left-color:var(--warn)}
.cita .hora{font:500 1rem var(--mono)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);text-align:center;font-size:.9rem}
.rem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:0}
.msg{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.9rem;white-space:pre-wrap;margin-top:6px}
.tag{font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.late{color:var(--out)}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted);min-width:0}
input,select,textarea{font:400 .95rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.form .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:700 .85rem var(--body);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(5,20,19,.45)}
dialog form.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.items td input{padding:5px 7px}
.total{font:500 1.3rem var(--mono)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:700;font-size:.9rem;z-index:50}
.notice{border:1px solid var(--warn);color:var(--ink);background:var(--soft);border-radius:8px;padding:10px 14px;font-size:.9rem}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:44px 1fr 92px;gap:8px;align-items:center;font-size:.8rem}
.bar .track{display:flex;flex-direction:column;gap:2px}
.bar .b{height:7px;border-radius:3px}
.bar .bi{background:var(--in)} .bar .bo{background:var(--out)}
@media (max-width:560px){.rem{grid-template-columns:1fr}}
/* ---- Demostración del bot ---- */
:root{--chatbg:#e4ece8;--b-in:#ffffff;--b-out:#d3efe1;--phone:#10292a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--chatbg:#0b1513;--b-in:#1b2a28;--b-out:#174237;--phone:#000000}}
:root[data-theme="dark"]{--chatbg:#0b1513;--b-in:#1b2a28;--b-out:#174237;--phone:#000000}
.demo-hero{display:flex;flex-direction:column;gap:6px;max-width:72ch}
.demo-hero p{margin:0;color:var(--muted)}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.pstep{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;transition:border-color .3s,background .3s,transform .3s}
.pstep svg{width:26px;height:26px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.pstep b{font-family:var(--display);font-size:.95rem}
.pstep span{font-size:.8rem;color:var(--muted)}
.pstep.on{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
.pstep.on svg{stroke:var(--accent)}
.pstep .n{font:500 .7rem var(--mono);color:var(--accent);letter-spacing:.06em}
@media (max-width:640px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tl{position:relative;padding:34px 4px 4px}
.tl .track{position:absolute;left:8%;right:8%;top:44px;height:4px;background:var(--line);border-radius:2px}
.tl .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:2px;transition:width 1s ease}
.tl .pts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;position:relative}
.tl .pt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:.8rem;color:var(--muted)}
.tl .dot{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--line);transition:all .4s;margin-top:-1px}
.tl .pt.on{color:var(--ink)} .tl .pt.on .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 5px var(--soft)}
.tl .pt b{font-family:var(--display);font-size:.88rem}
.demo-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:780px){.demo-grid{grid-template-columns:minmax(0,1fr)}}
.phone{width:100%;max-width:340px;margin:0 auto;border:9px solid var(--phone);border-radius:34px;background:var(--chatbg);overflow:hidden;height:610px;display:flex;flex-direction:column;box-shadow:0 18px 40px -22px rgba(0,0,0,.45)}
.phone .bar{background:var(--accent);color:var(--accent-ink);padding:12px 14px 10px;display:flex;gap:10px;align-items:center}
.phone .av{width:34px;height:34px;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:grid;place-items:center;font:700 .9rem var(--display);flex:none}
.phone .who{min-width:0} .phone .who b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone .who small{font-size:.72rem;opacity:.85}
.chat{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.daysep{align-self:center;font-size:.7rem;background:var(--b-in);color:var(--muted);padding:3px 10px;border-radius:6px;animation:pop .35s ease both}
.bub{max-width:86%;padding:7px 10px 5px;border-radius:10px;font-size:.86rem;line-height:1.38;white-space:pre-wrap;animation:pop .35s ease both;color:var(--ink)}
.bub.bot{align-self:flex-start;background:var(--b-in);border-top-left-radius:2px}
.bub.pac{align-self:flex-end;background:var(--b-out);border-top-right-radius:2px}
.bub .meta{font:400 .66rem var(--mono);color:var(--muted);text-align:right;margin-top:2px}
.bub .tk{color:var(--info)}
.tbtns{display:flex;flex-direction:column;margin:6px -10px -5px;border-top:1px solid var(--line)}
.tbtn{text-align:center;color:var(--info);font-weight:700;padding:8px;font-size:.84rem;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.tbtn:last-child{border-bottom:0}
.tbtn.chosen{background:var(--soft)}
.tbtn .rip{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--info);opacity:.35;animation:rip .7s ease-out forwards}
.loc{margin:4px 0 2px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.loc .map{height:78px;background:repeating-linear-gradient(35deg,var(--soft) 0 14px,var(--chatbg) 14px 16px);display:grid;place-items:center}
.loc .map svg{width:26px;height:26px;fill:var(--out)}
.loc div.t{padding:5px 8px;font-size:.78rem}
.typing{align-self:flex-start;background:var(--b-in);border-radius:10px;padding:10px 12px;display:flex;gap:4px;animation:pop .3s ease both}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.finger{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid var(--info);background:rgba(43,95,168,.18);pointer-events:none;z-index:5;transition:left .6s ease,top .6s ease,opacity .3s;opacity:0}
.phone-wrap{position:relative}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 10px;border-radius:8px;border:1px solid transparent;color:var(--muted);transition:all .3s;counter-increment:s}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:500 .75rem var(--mono)}
.steps li.on{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.steps li.on::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.done{color:var(--ink)} .steps li.done::before{border-color:var(--accent);color:var(--accent)}
.crmcard{display:flex;flex-direction:column;gap:10px}
.crmcard .cita{transition:box-shadow .4s}
.crmcard .cita.flash{box-shadow:0 0 0 3px var(--accent)}
.log{font:400 .78rem var(--mono);display:flex;flex-direction:column;gap:4px;max-height:170px;overflow-y:auto}
.log div{animation:pop .3s ease both;color:var(--muted)} .log div b{color:var(--ink);font-weight:500}
.benef{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.benef div{border-top:3px solid var(--accent);padding-top:8px}
.benef b{font-family:var(--display);display:block;margin-bottom:2px}
.benef span{font-size:.86rem;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
@keyframes rip{to{width:260px;height:260px;margin:-130px;opacity:0}}
@media (prefers-reduced-motion:reduce){.bub,.typing,.daysep,.log div{animation:none}.tl .fill{transition:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1 id="clinicName">Clínica Dental</h1>
        <div class="sub" id="todayLbl"></div>
      </div>
      <span class="mode" id="modeLbl">Conectando…</span>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script>

const fmtDate=s=>new Date(s+"T12:00:00").toLocaleDateString("es-DO",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=s=>new Date(s+"T12:00:00").toLocaleDateString("es-DO",{day:"numeric",month:"short"});
const hora12=h=>{if(!h)return"";let[H,M]=h.split(":").map(Number);const p=H>=12?"p. m.":"a. m.";H=H%12||12;return`${H}:${String(M).padStart(2,"0")} ${p}`};
const RD=n=>"RD$ "+Number(n||0).toLocaleString("es-DO",{minimumFractionDigits:0,maximumFractionDigits:2});

/* ---------- Data layer: db compartida o modo local ---------- */
async function save(col,id,body){
  id=id||uid(); const clean={...body}; delete clean.id;
  if(S.live){
    try{await S.db.collection(col).doc(id).set(clean)}
    catch(e){handleErr(e);return null}
  }else{
    const arr=S.data[col]; const i=arr.findIndex(x=>x.id===id);
    if(i>=0)arr[i]={id,...clean}; else arr.push({id,...clean}); persistLocal(); render();
  }
  return id;
}
async function patch(col,id,fields){const cur=by(col,id);if(!cur)return;return save(col,id,{...cur,...fields})}
async function remove(col,id){
  if(S.live){try{await S.db.collection(col).doc(id).delete()}catch(e){handleErr(e)}}
  else{S.data[col]=S.data[col].filter(x=>x.id!==id);persistLocal();render()}
}
function handleErr(e){
  if(e&&e.code==="invalid_argument"){S.readOnly=true;toast("No tienes permiso para guardar cambios aquí")}
  else if(e&&e.code==="quota_exceeded")toast("La base de datos está llena: borra registros viejos");
  else toast("No se pudo guardar. Intenta de nuevo");
}
const LS_KEY="bonadent-crm-v1";
function persistLocal(){if(S.live)return;try{localStorage.setItem(LS_KEY,JSON.stringify(S.data))}catch(e){}}
function loadLocalSeed(){
  try{const saved=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(saved&&saved.doctores){for(const c of COLS)S.data[c]=saved[c]||[];S.savedLocal=true;return}}catch(e){}
  const seed=buildSeed(TODAY);
  for(const c of COLS)S.data[c]=Object.entries(seed[c]||{}).map(([id,v])=>({id,...v}));
}
let snapCount=0;
async function init(){
  render();

  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  if(!db){
    loadLocalSeed();
    $("#modeLbl").textContent="En esta computadora · se guarda en este navegador";persistLocal();
  }else{
    S.db=db;S.live=true;$("#modeLbl").textContent="En vivo · compartido";$("#modeLbl").classList.add("live");
    COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{
      S.data[c]=snap.docs.map(d=>({id:d.id,...d.data()}));render();
    },e=>{if(e.code==="revoked"){$("#modeLbl").textContent="Sin acceso"}}));
  }
  try{S.sample=await window.claude?.use?.("sample")}catch(e){S.sample=null}
  render();
}

/* ---------- Cálculos ---------- */
const saldoPaciente=pid=>{
  const cargos=S.data.cotizaciones.filter(q=>q.pacienteId===pid&&q.estado==="aprobada").reduce((a,q)=>a+Number(q.total||0),0);
  const pagos=S.data.caja.filter(m=>m.tipo==="ingreso"&&m.pacienteId===pid).reduce((a,m)=>a+Number(m.monto||0),0);
  return cargos-pagos;
};
const totalCot=(items,desc)=>{const sub=items.reduce((a,i)=>a+Number(i.precio||0)*Number(i.cant||0),0);return Math.round(sub*(1-(Number(desc)||0)/100)*100)/100};
const activa=c=>c.estado==="programada"||c.estado==="confirmada"||c.estado==="aplazada";
function recordatorios(){
  const out=[];
  for(const c of S.data.citas){
    if(!activa(c)||c.fecha<TODAY)continue;
    const dias=diffDays(TODAY,c.fecha);
    if(dias===0&&!c.rem0)out.push({c,tipo:"hoy",dias});
    else if(dias>0&&dias<=3&&!c.rem3)out.push({c,tipo:"previo",dias,tarde:dias<3});
  }
  return out.sort((a,b)=>(a.c.fecha+a.c.hora).localeCompare(b.c.fecha+b.c.hora));
}
function proximosRecordatorios(){
  const out=[];
  for(const c of S.data.citas){
    if(!activa(c))continue;
    const r3=addDays(c.fecha,-3);
    if(!c.rem3&&r3>TODAY&&r3<=addDays(TODAY,7))out.push({fecha:r3,c,tipo:"3 días antes"});
    if(!c.rem0&&c.fecha>TODAY&&c.fecha<=addDays(TODAY,7))out.push({fecha:c.fecha,c,tipo:"Mismo día"});
  }
  return out.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function mensajeCita(c,tipo,dias){
  const p=pac(c.pacienteId)||{}, d=doc(c.doctorId)||{}, cl=clinica();
  const nombre=(p.nombre||"").split(" ")[0]||"";
  if(tipo==="hoy")return`Hola ${nombre}, le recordamos que HOY tiene su cita de ${c.tratamiento||"odontología"} a las ${hora12(c.hora)} con ${d.nombre||"su odontólogo"} en ${cl.nombre}.\n\nSi necesita aplazarla, responda este mensaje y le buscamos otro horario. ¡Le esperamos!`;
  return`Hola ${nombre}, le recordamos que en ${dias} ${dias===1?"día":"días"}, el ${fmtDate(c.fecha)} a las ${hora12(c.hora)}, tiene su cita de ${c.tratamiento||"odontología"} con ${d.nombre||"su odontólogo"} en ${cl.nombre}.\n\nSi desea aplazarla, responda este mensaje y le buscamos otro horario.`;
}
function waLink(tel,text){
  let n=String(tel||"").replace(/\D/g,"");
  if(n.length===10)n="1"+n;
  return`https://wa.me/${n}?text=${encodeURIComponent(text)}`;
}
function textoCotizacion(q){
  const p=pac(q.pacienteId)||{}, cl=clinica();
  const lines=q.items.map(i=>`• ${i.nombre}${i.cant>1?` x${i.cant}`:""}: ${RD(i.precio*i.cant)}`).join("\n");
  const sub=q.items.reduce((a,i)=>a+i.precio*i.cant,0);
  return`${cl.nombre}\nCotización COT-${String(q.numero).padStart(4,"0")} · ${fmtShort(q.fecha)}\nPaciente: ${p.nombre||""}\n\n${lines}\n\nSubtotal: ${RD(sub)}${q.descuento?`\nDescuento: ${q.descuento}%`:""}\nTOTAL: ${RD(q.total)}\n\nVálida por 30 días.${q.notas?`\nNota: ${q.notas}`:""}`;
}

/* Cotizaciones */
function matchLocal(text){
  const t=text.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const nums={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6};
  const items=[];
  for(const s of S.data.servicios){
    const key=s.nombre.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[ (]/)[0];
    const re=new RegExp(`(?:(\\d+|un|una|uno|dos|tres|cuatro|cinco|seis)\\s+)?${key}`);
    const m=t.match(re);if(m){const q=m[1]?(nums[m[1]]||+m[1]):1;items.push({nombre:s.nombre,precio:s.precio,cant:q})}
  }
  return items;
}
async function armarCot(text){
  if(S.sample){
    try{
      const res=await S.sample.json(`Eres el asistente de una clínica dental. Convierte la solicitud en una lista de servicios del catálogo. Usa SOLO servicios del catálogo, con su precio exacto. Responde JSON: {"items":[{"nombre":string,"precio":number,"cant":number}],"descuento":number,"notas":string}. descuento es % (0 si no se menciona).\n\nCatálogo:\n${S.data.servicios.map(s=>`- ${s.nombre}: ${s.precio}`).join("\n")}\n\nSolicitud: ${text}`,{modelTier:"quick"});
      if(res&&Array.isArray(res.items))return res;
    }catch(e){}
  }
  return{items:matchLocal(text),descuento:0,notas:""};
}
function cotEditor(q){
  const rows=q.items.map((i,k)=>`<tr><td>${esc(i.nombre)}</td><td><input type="number" min="1" value="${i.cant}" data-k="${k}" data-f="cant" id="qi_c${k}" style="width:64px"></td><td><input type="number" min="0" value="${i.precio}" data-k="${k}" data-f="precio" id="qi_p${k}" style="width:100px"></td><td class="r money">${RD(i.precio*i.cant)}</td><td><button class="btn ghost sm danger" type="button" data-rm="${k}" aria-label="Quitar">✕</button></td></tr>`).join("");
  return`<div class="tablewrap"><table class="items"><thead><tr><th>Servicio</th><th>Cant.</th><th>Precio</th><th class="r">Importe</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="muted">Agrega servicios escribiendo arriba o eligiéndolos de la lista.</td></tr>`}</tbody></table></div>
  <div class="row between"><div class="row"><select id="q_add" style="width:auto"><option value="">+ Agregar servicio…</option>${sortN(S.data.servicios).map(s=>`<option value="${s.id}">${esc(s.nombre)} · ${RD(s.precio)}</option>`).join("")}</select>
  <label style="flex-direction:row;align-items:center;gap:6px">Descuento %<input type="number" min="0" max="100" id="q_desc" value="${q.descuento||0}" style="width:70px"></label></div>
  <div><span class="muted small">Total </span><span class="total">${RD(totalCot(q.items,q.descuento))}</span></div></div>`;
}
ACT.nuevaCot=()=>{
  const q={items:[],descuento:0,notas:"",pacienteId:""};
  modal(`<h2>Nueva cotización</h2>
    <label>Paciente<select name="pacienteId" id="q_p" required>${opts(sortN(S.data.pacientes),"","nombre","Elegir paciente…")}</select></label>
    <label>¿Qué necesita el paciente? <span class="muted" style="font-weight:400">Escribe o usa el micrófono del teclado para dictar</span>
      <textarea id="q_txt" placeholder="Ej.: limpieza, 2 resinas y una radiografía, con 10% de descuento"></textarea></label>
    <div class="row"><button class="btn" type="button" id="q_go">Armar cotización automática</button><span class="small muted" id="q_st"></span></div>
    <div id="q_ed">${cotEditor(q)}</div>
    <label>Notas<input name="notas" id="q_n" placeholder="Ej.: Plan de pago en 3 cuotas"></label>
    ${dlgFoot("Guardar cotización")}`,
  async fd=>{
    if(!q.items.length){toast("Agrega al menos un servicio");return false}
    const numero=Math.max(0,...S.data.cotizaciones.map(x=>x.numero||0))+1;
    const body={numero,pacienteId:fd.pacienteId,fecha:TODAY,items:q.items,descuento:+q.descuento||0,total:totalCot(q.items,q.descuento),estado:"borrador",notas:fd.notas||q.notas||""};
    const id=await save("cotizaciones",null,body);toast(`COT-${String(numero).padStart(4,"0")} creada`);
    setTimeout(()=>ACT.verCot({id,_body:body}),120);
  },
  f=>{
    const ed=()=>{$("#q_ed",f).innerHTML=cotEditor(q)};
    $("#q_go",f).addEventListener("click",async()=>{const t=$("#q_txt",f).value.trim();if(!t)return;$("#q_st",f).textContent="Armando…";
      const r=await armarCot(t);q.items=r.items.map(i=>({nombre:i.nombre,precio:+i.precio,cant:+i.cant||1}));if(r.descuento)q.descuento=+r.descuento;if(r.notas&&!$("#q_n",f).value)$("#q_n",f).value=r.notas;
      $("#q_st",f).textContent=q.items.length?`${q.items.length} servicio(s) agregados`:"No encontré servicios del catálogo en el texto";ed()});
    f.addEventListener("input",e=>{const el=e.target;if(el.dataset.k!=null){q.items[+el.dataset.k][el.dataset.f]=+el.value||0;const tr=el.closest("tr");tr.querySelector(".money").textContent=RD(q.items[+el.dataset.k].precio*q.items[+el.dataset.k].cant);f.querySelector(".total").textContent=RD(totalCot(q.items,q.descuento))}

const ICON={

  agenda:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3"/></svg>',

const SCN={
  previo:{label:"Aviso 3 días antes",steps:["7:45 a. m.: el bot revisa la agenda y encuentra la cita que es en 3 días.","Le escribe primero al paciente con fecha, hora, odontólogo y dirección.","El paciente toca “Confirmo” con un solo toque.","El bot le responde y la cita pasa a Confirmada en la agenda, sin que recepción haga nada."]},
  hoy:{label:"Aviso el mismo día",steps:["El día de la cita, a las 7:45 a. m., el bot vuelve a revisar la agenda.","Envía el recordatorio de hoy con la hora exacta.","Manda la ubicación de la clínica para llegar sin perderse.","El paciente responde “Ahí estaré” y recepción lo ve en la agenda."]},
  aplaza:{label:"El paciente aplaza",steps:["7:45 a. m.: el bot revisa la agenda.","Envía el aviso de 3 días antes.","El paciente no puede ese día y toca “Aplazar”.","El bot busca en la agenda los horarios libres de su mismo odontólogo.","El paciente elige un horario nuevo.","La cita se mueve sola en la agenda y los recordatorios se reprograman para la nueva fecha."]}
};
const DEMO={run:0,scn:"previo",timers:[],
  stop(){this.run++},
  mount(){this.play(this.scn)},
  data(){
    const futuras=S.data.citas.filter(c=>activa(c)&&c.fecha>=TODAY&&pac(c.pacienteId)).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
    const c=futuras.find(x=>diffDays(TODAY,x.fecha)>=1)||futuras[0];
    const cl=clinica();
    const base=c?{...c}:{fecha:addDays(TODAY,3),hora:"09:00",tratamiento:"Control de brackets",doctorId:""};
    const fecha=addDays(TODAY,3);
    const p=c?pac(c.pacienteId):{nombre:"Ana Rodríguez",telefono:"809-555-0111"};
    const d=c?doc(c.doctorId):null;
    return{fecha,hora:base.hora,tratamiento:base.tratamiento||"Consulta",doctorId:base.doctorId,doctor:d?d.nombre:"Dra. Laura Peña",
      nombre:p.nombre,corto:(p.nombre||"").split(" ")[0],tel:p.telefono||"809-555-0111",clinica:cl.nombre||"Clínica Dental",direccion:cl.direccion||"Calle del Sol #45, Santiago"};
  },
  libres(d){
    const out=[];const horas=["09:00","10:30","15:30"];
    for(let i=1;i<=10&&out.length<3;i++){
      const f=addDays(d.fecha,i);if(new Date(f+"T12:00:00").getDay()===0)continue;
      for(const h of horas){if(out.length>=3)break;
        const ocupado=S.data.citas.some(o=>activa(o)&&o.doctorId===d.doctorId&&o.fecha===f&&o.hora===h);
        if(!ocupado){out.push({f,h});break}}
    }
    return out;
  },
  async play(scn){
    this.scn=scn;const id=++this.run;
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const k=reduce?0.08:1;
    const alive=()=>id===this.run&&document.getElementById("demoRoot");
    const sleep=ms=>new Promise(r=>setTimeout(r,ms*k));
    const root=$("#demoRoot");if(!root)return;
    root.querySelectorAll("[data-scn]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.scn===scn));
    const d=this.data();
    const chat=$("#chat"),steps=$("#dsteps"),logEl=$("#dlog"),finger=$("#finger");
    chat.innerHTML="";logEl.innerHTML="";
    steps.innerHTML=SCN[scn].steps.map(s=>`<li>${esc(s)}</li>`).join("");
    const lis=[...steps.children];
    const step=i=>lis.forEach((li,j)=>{li.classList.toggle("on",j===i);li.classList.toggle("done",j<i)});
    const now=t=>`<span class="meta">${t} <span class="tk">✓✓</span></span>`;
    const scroll=()=>{chat.scrollTop=chat.scrollHeight};
    const add=html=>{chat.insertAdjacentHTML("beforeend",html);scroll();return chat.lastElementChild};
    const log=t=>{logEl.insertAdjacentHTML("beforeend",`<div>${t}</div>`);logEl.scrollTop=logEl.scrollHeight};
    const typing=async ms=>{const el=add('<div class="typing"><i></i><i></i><i></i></div>');await sleep(ms);el.remove()};
    const crm=(estado,fecha,hora,nota)=>{$("#dcrm").innerHTML=`<article class="cita ${estado}"><div class="row between"><span class="hora">${hora12(hora)}</span><span class="chip st-${estado}">${estado}</span></div>
      <div><b>${esc(d.nombre)}</b><div class="small muted">${esc(d.tratamiento)} · ${esc(d.doctor)}</div><div class="small muted">${fmtDate(fecha)}</div></div>${nota?`<div class="small"><span class="tag">${nota}</span></div>`:""}</article>`;
      const c=$("#dcrm .cita");c.classList.add("flash");setTimeout(()=>c&&c.classList.remove("flash"),900)};
    const tap=async(btn,label)=>{
      const wrap=$("#phoneWrap").getBoundingClientRect(),r=btn.getBoundingClientRect();
      finger.style.left=(r.left-wrap.left+r.width/2-15)+"px";finger.style.top=(r.top-wrap.top+r.height/2-15)+"px";finger.style.opacity=1;
      await sleep(750);if(!alive())return;
      btn.insertAdjacentHTML("beforeend",'<span class="rip"></span>');btn.classList.add("chosen");
      await sleep(450);finger.style.opacity=0;
      await sleep(300);add(`<div class="bub pac">${esc(label)}${now(d.hora8||"7:52")}</div>`);
    };
    const tpl=(texto,btns,hora)=>add(`<div class="bub bot">${texto}${now(hora)}${btns?`<div class="tbtns">${btns.map(b=>`<div class="tbtn">${esc(b)}</div>`).join("")}</div>`:""}</div>`);
    const fLarga=f=>fmtDate(f);
    $("#tlfill").style.width="0%";$$tl(0);

    // Estado inicial
    crm("programada",scn==="hoy"?TODAY:d.fecha,d.hora,"");
    if(scn==="hoy"){crm("programada",TODAY,d.hora,"Confirmó hace 3 días")}
    step(0);
    add(`<div class="daysep">${scn==="hoy"?"Hoy":fLarga(TODAY)}</div>`);
    log(`<b>7:45 a. m.</b> Bot revisa la agenda de ${esc(d.clinica)}`);
    await sleep(1400);if(!alive())return;
    const fechaCita=scn==="hoy"?TODAY:d.fecha;
    log(`Encontró la cita de <b>${esc(d.nombre)}</b> · ${fmtShort(fechaCita)} ${hora12(d.hora)}`);
    $$tl(scn==="hoy"?2:1);
    await sleep(900);if(!alive())return;

    if(scn==="previo"||scn==="aplaza"){
      step(1);await typing(1300);if(!alive())return;
      const msg=tpl(`Hola ${esc(d.corto)} 👋\nLe recordamos su cita dental:\n\n📅 ${esc(fLarga(d.fecha))}\n🕘 ${esc(hora12(d.hora))}\n🦷 ${esc(d.tratamiento)} con ${esc(d.doctor)}\n📍 ${esc(d.clinica)}, ${esc(d.direccion)}\n\n¿Nos confirma su asistencia?`,["Confirmo","Aplazar"],"7:45");
      log(`Enviado a <b>${esc(d.tel)}</b> · plantilla recordatorio_cita_3dias`);
      crm("programada",d.fecha,d.hora,"Aviso de 3 días enviado");
      await sleep(2200);if(!alive())return;
      step(2);
      const btns=msg.querySelectorAll(".tbtn");
      if(scn==="previo"){
        await tap(btns[0],"Confirmo");if(!alive())return;
        log(`<b>${esc(d.corto)}</b> respondió: Confirmo`);
        await sleep(700);step(3);await typing(1100);if(!alive())return;
        tpl(`¡Gracias, ${esc(d.corto)}! ✅ Su cita quedó confirmada. El mismo día le enviaremos otro recordatorio. Le esperamos.`,null,"7:52");
        crm("confirmada",d.fecha,d.hora,"Confirmada por el paciente");
        log(`Agenda actualizada: cita <b>confirmada</b>`);
        step(4);
      }else{
        await tap(btns[1],"Aplazar");if(!alive())return;
        log(`<b>${esc(d.corto)}</b> pidió aplazar`);
        await sleep(600);step(3);await typing(1300);if(!alive())return;
        const libres=this.libres(d);
        const opciones=libres.map(x=>`${fmtShort(x.f)} · ${hora12(x.h)}`);
        log(`Buscó horarios libres de <b>${esc(d.doctor)}</b>: ${libres.length} disponibles`);
        const m2=tpl(`Sin problema, ${esc(d.corto)}. Estos son los horarios libres con ${esc(d.doctor)}. Elija el que le convenga:`,opciones,"7:53");
        await sleep(2000);if(!alive())return;
        step(4);
        const elegido=libres[1]||libres[0];
        await tap(m2.querySelectorAll(".tbtn")[libres[1]?1:0],`${fmtShort(elegido.f)} · ${hora12(elegido.h)}`);if(!alive())return;
        await sleep(600);step(5);await typing(1200);if(!alive())return;
        tpl(`Listo ✅ Su cita quedó para el ${esc(fLarga(elegido.f))} a las ${esc(hora12(elegido.h))} con ${esc(d.doctor)}.\n\nLe recordaremos 3 días antes y el mismo día.`,null,"7:54");
        crm("programada",elegido.f,elegido.h,"Aplazada por WhatsApp · recordatorios reprogramados");
        log(`Agenda actualizada: cita movida al <b>${fmtShort(elegido.f)} ${hora12(elegido.h)}</b>`);
        log(`Recordatorios reprogramados: ${fmtShort(addDays(elegido.f,-3))} y ${fmtShort(elegido.f)}`);
        $$tl(1);
        step(6);
      }
    }else{
      step(1);await typing(1200);if(!alive())return;
      const msg=tpl(`Buenos días, ${esc(d.corto)} ☀️\nHOY es su cita a las ${esc(hora12(d.hora))} con ${esc(d.doctor)} (${esc(d.tratamiento)}).\n\nLe esperamos en ${esc(d.clinica)}.`,["Ahí estaré","Aplazar"],"7:45");
      log(`Enviado a <b>${esc(d.tel)}</b> · plantilla recordatorio_cita_hoy`);
      crm("confirmada",TODAY,d.hora,"Aviso del día enviado");
      await sleep(1500);if(!alive())return;
      step(2);await typing(800);if(!alive())return;
      add(`<div class="bub bot"><div class="loc"><div class="map">${ICON.pin}</div><div class="t"><b>${esc(d.clinica)}</b><br>${esc(d.direccion)}</div></div>${now("7:45")}</div>`);
      log(`Ubicación enviada`);
      await sleep(1800);if(!alive())return;
      step(3);
      await tap(msg.querySelectorAll(".tbtn")[0],"Ahí estaré 👍");if(!alive())return;
      await sleep(500);await typing(900);if(!alive())return;
      tpl(`¡Perfecto! Nos vemos a las ${esc(hora12(d.hora))}. 🦷`,null,"8:03");
      crm("confirmada",TODAY,d.hora,"Paciente viene en camino");
      log(`Recepción ve en la agenda: <b>${esc(d.corto)} asistirá</b>`);
      step(4);
    }
    $$tl(scn==="hoy"?3:1);
  }
};
function $$tl(n){const pts=[...document.querySelectorAll(".tl .pt")];pts.forEach((p,i)=>p.classList.toggle("on",i<=n));const f=$("#tlfill");if(f)f.style.width=(n/3*100)+"%"}
